<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>포토제네시스 · 프로토타입 0f.1 관측소 지도 핀</title>
<link rel="stylesheet" href="./styles.css?v=20260801-afterimage">
</head>
<body>
<div id="gameStart" role="button" tabindex="0" aria-label="게임 시작">
  <div class="startEyebrow">PHOTOGENESIS · FIELD EXPOSURE</div>
  <div class="startTitle">포토제네시스</div>
  <div class="startGo">화면을 누르면, 눈을 뜹니다 ▸</div>
</div>
<div id="awaken" aria-hidden="true">
  <div class="awFlash"></div>
  <div class="lid top"></div>
  <div class="lid bot"></div>
  <div class="puff"></div>
</div>
<div class="hud" id="nameTag"></div>
<div class="hud" id="hint">클릭: 시점 고정 · WASD 이동 · C 카메라 · 스페이스 셔터 · E 확인 · M 지도</div>
<div class="hud" id="queueBox"></div>
<div class="hud" id="handTag"></div>
<div class="hud" id="specTag"></div>
<div class="hud" id="filmTag"></div>
<div class="hud" id="sub"></div>
<div class="hud" id="prompt"></div>

<div class="hud" id="vf">
  <div class="frame"><span class="c3"></span><span class="c4"></span><span class="ret"></span></div>
  <div id="covTag"></div>
</div>
<div class="hud" id="grain"></div>
<div class="hud" id="edgeVeil"></div>
<div class="hud" id="flash"></div>
<div id="shuttercurtain"></div>

<button class="btn" id="btnConfirm">확인</button>
<button class="btn" id="btnMap">지도</button>
<button class="btn" id="btnCam">카메라</button>
<button class="btn" id="btnShut">셔터</button>

<div id="joy"><div id="joyBase"></div><div id="joyNub"></div></div>

<div id="mapOv">
  <div id="mapTitle">탐사 지도 · 이동 가능</div>
  <div id="mapStatus"></div>
  <div id="mapGrid"></div>
  <div id="mapLegend">닫힘<i style="background:#222a31"></i>현상 중<i style="background:#ffb326"></i>열림<i style="background:#e9f0f2"></i>재촬영<i style="background:#83e2dc"></i>관측소 ⌂</div>
  <button class="btn close" id="mapClose" aria-label="지도 닫기">×</button>
</div>

<div id="photoPanel">
  <div id="photoBoard">
    <figure><img id="photoImg" alt="촬영 순간"><figcaption id="photoBeforeCap">촬영 순간</figcaption></figure>
    <figure id="photoDevelopedFrame"><img id="photoDeveloped" alt="확대 현상본"><figcaption>확대 현상본 · 잠상에서 발견</figcaption></figure>
  </div>
  <div id="photoCap"></div>
  <button class="btn" id="photoPin">탐사 핀 꽂기</button>
  <button class="btn close" id="photoClose">닫기</button>
</div>

<div id="specPanel">
  <div id="specCard">
    <div id="specTier"></div>
    <div id="specNm"></div>
    <div class="srow"><div class="k">보이는 것</div><div class="v" id="specSee"></div></div>
    <div class="srow"><div class="k">도감</div><div class="v" id="specLog"></div></div>
    <div class="srow"><div class="k">잔류</div><div class="v" id="specTrace"></div></div>
    <div id="specCount"></div>
  </div>
  <button class="btn close" id="specClose">닫기</button>
</div>

<script defer src="./vendor/three.min.js"></script>
<script defer src="./game.js?v=20260801-afterimage-rhythm"></script>
</body>
</html>
