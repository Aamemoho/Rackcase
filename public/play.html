<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <title>카트리지 로딩 — aamemoho</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#07090c;color:#e8ecf0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}.bar{min-height:58px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,.13);background:rgba(8,10,14,.96)}.back{color:#bac4cd;text-decoration:none;font:600 .72rem/1 ui-monospace,monospace;letter-spacing:.08em}.meta{min-width:0;margin-left:auto;text-align:right}.title{margin:0;font:400 1rem/1.2 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{margin:4px 0 0;color:#73808b;font:600 .58rem/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.stage{position:relative;min-height:0}.frame{width:100%;height:100%;border:0;background:#0a0c10}.message{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#090b0f;color:#8996a0;z-index:2}.message[hidden]{display:none}.error{color:#ff9e9e}.credit{display:none}@media(max-width:520px){.bar{min-height:54px}.meta{max-width:68vw}.credit{font-size:8px}}
  </style>
  <script type="module" src="./js/play.js"></script>
</head>
<body>
  <header class="bar">
    <a class="back" href="/">← RACK</a>
    <div class="meta"><h1 class="title" id="title">카트리지 로딩</h1><p class="status" id="status">검증된 슬롯 확인 중</p></div>
  </header>
  <main class="stage">
    <div class="message" id="message">카트리지를 꽂는 중…</div>
    <iframe class="frame" id="frame" title="인터랙티브 카트리지" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    <div class="credit" id="credit"></div>
  </main>
</body>
</html>
