<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a0e">
  <meta name="description" content="aamemoho의 작동 표본과 독립 세계를 보관하는 카트리지 랙.">
  <link rel="icon" href="data:,">
  <title>aamemoho — cartridge rack</title>
  <link rel="stylesheet" href="./css/hub.css">
  <script type="module" src="./js/hub.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-glow"></span>
    <span class="ambient-grain"></span>
  </div>

  <header class="site-head">
    <a class="wordmark" href="/" aria-label="aamemoho 카트리지 랙">aamemoho</a>
    <div class="head-register" aria-label="랙 상태">
      <span class="signal" aria-hidden="true"></span>
      <span>RACK 01</span>
      <span class="head-divider">/</span>
      <span>ONLINE</span>
      <a class="status-link" href="/status/">STATUS ↗</a>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="rack-title">
      <div>
        <p class="eyebrow">CARTRIDGE STORAGE · AAMEMOHO</p>
        <h1 id="rack-title">꺼낼 수 있는<br><em>작은 세계들.</em></h1>
      </div>
      <p class="intro-copy">짧은 작동 표본과 독립된 게임을 같은 보관함에 둡니다. 설명은 얇게, 입장은 바로.</p>
    </section>

    <section class="cabinet" aria-labelledby="index-title">
      <div class="cabinet-head">
        <h2 id="index-title">SLOT INDEX</h2>
        <p class="rack-status" id="rack-status" role="status">색인 확인 중…</p>
      </div>
      <div class="rack-rail rack-rail-top" aria-hidden="true"></div>
      <div class="card-grid" id="card-grid"></div>
      <div class="rack-rail rack-rail-bottom" aria-hidden="true"></div>
    </section>
  </main>

  <footer>
    <p>AI 생성 도구 활용 · 콘셉트, 연출, 선별, 편집: aamemoho</p>
    <p>© 2026 AAMEMOHO</p>
  </footer>

  <noscript>
    <p class="fatal">색인을 읽으려면 JavaScript가 필요합니다. <a href="https://sphere.aamemoho.com">침식의 길 열기 ↗</a></p>
  </noscript>
</body>
</html>
